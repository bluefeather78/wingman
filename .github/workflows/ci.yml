name: CI

# Gate deploys on a green unit suite. The tests are hermetic (conftest blocks real
# sockets and mocks every Supabase/Gemini/Claude/Stripe seam), so no secrets are needed
# and this runs anywhere. To make it an actual deploy gate, enable
# "Wait for CI to pass before deploying" in the Render dashboard (Settings) — Render reads
# these GitHub commit statuses. Without that, CI is advisory and Render still ships red commits.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest tests/unit -q

# Render Web Service for the Highschool Wingman FastAPI app (PLAN_1_decompose.md).
#
# Ships app/ only. WINGMAN_ENABLE_OPS is deliberately NOT set here, so the deployed
# service mounts no /api/agents/*, /api/seeds, or /admin route — the ops console and the
# offline agents run locally, never on Render. Secrets are set in the Render dashboard
# (sync: false keeps them out of this file / git); SUPABASE_SERVICE_KEY must live only in
# the server environment and never reach any client.
services:
  - type: web
    name: wingman
    runtime: python
    plan: free
    # Also builds the Expo web export so this service serves the app at the root of the
    # custom domain (SERVE_WEB_DIST below) — one origin for app + API, no CORS in prod,
    # and the Google OAuth callback host stays put. The separate static site below remains
    # an alternative; point the custom domain at it and drop these two lines to use it.
    buildCommand: pip install -r requirements.txt && cd frontend && npm ci && npx expo export -p web
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.2"
      # Serve frontend/dist at the root (deliberately never set locally — a stale local
      # dist would silently shadow the Metro dev server; see app/main.py).
      - key: SERVE_WEB_DIST
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Signing secret for session-auth JWTs (Phase 2, PLAN_2_auth.md). Set this in the
      # Render dashboard; if it is unset the auth layer fails closed. Never commit its value.
      - key: JWT_SECRET
        sync: false
      # Phase 3 (PLAN_3_rn.md): where Google sign-in may hand the one-time token back to the
      # Expo app. Set this in the dashboard to the static site's origin once it's live
      # (e.g. https://wingman-web.onrender.com). Until set, the allowlist default covers only
      # local dev, so Google sign-in from the deployed web app won't complete.
      - key: GOOGLE_APP_REDIRECTS
        sync: false

  # ---------------- Static Site: the Expo (React Native Web) frontend ----------------
  # Phase 3: same monorepo, second Render service. Builds the Expo web export and serves the
  # static bundle. Native (iOS/Android) ships via EAS, never Render. The API base is wired
  # from the web service above; the client prepends https:// to the bare host it returns.
  - type: web
    name: wingman-web
    runtime: static
    buildCommand: cd frontend && npm ci && npx expo export -p web
    staticPublishPath: frontend/dist
    # expo-router hydrates and resolves the route client-side, so serve index.html for any
    # path (deep links included) and let the app render the right screen.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_BASE
        fromService:
          type: web
          name: wingman
          property: host
